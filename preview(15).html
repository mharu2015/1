<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>家庭NFC銀行OS GAME</title>

<style>
body {
  font-family: sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.card {
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.big {
  font-size:42px;
  color:gold;
}

button, input {
  font-size:16px;
  padding:8px;
  margin:4px;
}
</style>
</head>

<body>

<h1>🏦 家庭NFC銀行OS GAME</h1>

<!-- 📡 NFC -->
<div class="card">
  <button onclick="startNFC()">📡 NFCログイン</button>
  <p id="user">未ログイン</p>
</div>

<!-- 💰 情報 -->
<div class="card">
  <h2>💰 残高</h2>
  <div id="balance" class="big">0</div>

  <h3>⭐ レベル: <span id="level">1</span></h3>
  <h3>📈 EXP: <span id="exp">0</span>/100</h3>
</div>

<!-- 🏪 お店 -->
<div class="card">
  🍭30 <button onclick="buy(30)">購入</button>
  🎮80 <button onclick="buy(80)">購入</button>
</div>

<!-- 💳 引き出し -->
<div class="card">
  <h2>💳 ATM引き出し</h2>
  <input id="withdraw" type="number">
  <button onclick="withdraw()">引き出す</button>
</div>

<!-- 💸 振込 -->
<div class="card">
  <h2>💸 振込</h2>
  <input id="to" placeholder="相手ID (002など)">
  <input id="amount" type="number" placeholder="金額">
  <button onclick="send()">送金</button>
</div>

<!-- 🎮 お手伝い -->
<div class="card">
  <h2>🎮 お手伝い（EXP+）</h2>
  <input id="work" type="number" placeholder="ポイント">
  <button onclick="work()">実行</button>
</div>

<!-- 📊 ログ -->
<div class="card">
  <h2>📊 ログ</h2>
  <pre id="log"></pre>
</div>

<script>

/* 🧠 家族DB */
let db = {
  "001": { name:"父", balance:0, exp:0, level:1 },
  "002": { name:"母", balance:0, exp:0, level:1 },
  "003": { name:"子A", balance:0, exp:0, level:1 },
  "004": { name:"子B", balance:0, exp:0, level:1 }
};

let current = null;

/* 🔒 数値安全 */
function num(v){
  v = Number(v);
  if(isNaN(v)) return 0;
  return v;
}

/* 💾 保存 */
function save(){
  localStorage.setItem("bank_game", JSON.stringify(db));
}

/* 📥 読み込み */
function load(){
  let d = localStorage.getItem("bank_game");
  if(d) db = JSON.parse(d);
}

/* 📡 NFC */
async function startNFC(){
  const ndef = new NDEFReader();
  await ndef.scan();

  log("📡 待機中");

  ndef.onreading = (event)=>{
    const d = new TextDecoder();
    let raw = "";

    for(const r of event.message.records){
      raw += d.decode(r.data);
    }

    let id = raw.trim().replace("wallet=","");
    let m = id.match(/\d+/);
    if(m) id = m[0];

    if(!db[id]) return;

    current = id;
    update();
    save();

    log("ログイン " + id);
  };
}

/* 📊 更新 */
function update(){

  if(!current) return;

  let u = db[current];

  document.getElementById("user").innerText =
    u.name + " ID:" + current;

  document.getElementById("balance").innerText = u.balance;
  document.getElementById("level").innerText = u.level;
  document.getElementById("exp").innerText = u.exp;
}

/* 🏪 購入 */
function buy(p){
  if(!current) return;

  if(db[current].balance < p) return;

  db[current].balance -= p;

  gainExp(5);

  log("購入 -" + p);

  save();
  update();
}

/* 💳 引き出し */
function withdraw(){
  let v = num(document.getElementById("withdraw").value);

  if(db[current].balance < v) return;

  db[current].balance -= v;

  log("引き出し -" + v);

  save();
  update();
}

/* 💸 送金 */
function send(){
  let to = document.getElementById("to").value;
  let v = num(document.getElementById("amount").value);

  if(!db[to]) return;

  if(db[current].balance < v) return;

  db[current].balance -= v;
  db[to].balance += v;

  log(current + "→" + to + " " + v);

  save();
  update();
}

/* 🎮 お手伝い（EXP） */
function work(){
  let v = num(document.getElementById("work").value);

  db[current].balance += v;

  gainExp(v);

  log("お手伝い +" + v);

  save();
  update();
}

/* ⭐ レベルアップ */
function gainExp(v){
  let u = db[current];

  u.exp += v;

  if(u.exp >= 100){
    u.exp = 0;
    u.level += 1;

    log("🎉 レベルUP！");
  }
}

/* 📜 ログ */
function log(t){
  document.getElementById("log").innerText += "\n" + t;
}

/* 🚀 起動 */
load();
update();

</script>

</body>
</html>
