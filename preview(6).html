<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>家庭NFC財産OS FINAL</title>

<style>
body {
  font-family: sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.card {
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.big {
  font-size:42px;
  color:gold;
}

button, input {
  font-size:18px;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h1>🏠 家庭NFC財産OS FINAL</h1>

<!-- 📡 NFC -->
<div class="card">
  <button onclick="startNFC()">📡 NFC読み取り</button>
  <p id="user">未ログイン</p>
</div>

<!-- 💰 残高 -->
<div class="card">
  <h2>残高</h2>
  <div id="balance" class="big">0</div>
</div>

<!-- 🏪 お店 -->
<div class="card">
  <h2>🏪 お店モード</h2>

  🍭 お菓子 30 <button onclick="buy(30,'お菓子')">購入</button><br>
  🎮 ゲーム 80 <button onclick="buy(80,'ゲーム')">購入</button><br>
  🥤 ジュース 20 <button onclick="buy(20,'ジュース')">購入</button>
</div>

<!-- 🎁 お手伝い -->
<div class="card">
  <h2>🎁 お手伝い報酬</h2>
  <input id="reward" type="number" placeholder="ポイント">
  <button onclick="charge()">＋付与</button>
</div>

<!-- 📊 ログ -->
<div class="card">
  <h2>ログ</h2>
  <pre id="log"></pre>
</div>

<script>

/* 🧠 財産DB */
let db = {
  "001": { name:"父", balance:100 },
  "002": { name:"母", balance:100 },
  "003": { name:"子A", balance:100 },
  "004": { name:"子B", balance:100 }
};

let current = null;

/* 🔒 超安全数値 */
function num(v) {
  let n = Number(v);
  if (isNaN(n) || !isFinite(n)) return 0;
  return n;
}

/* 📡 NFC（完全耐性版） */
async function startNFC() {
  if (!("NDEFReader" in window)) {
    alert("NFC非対応ブラウザ");
    return;
  }

  const ndef = new NDEFReader();
  await ndef.scan();

  log("📡 NFC待機中...");

  ndef.onreading = (event) => {
    const decoder = new TextDecoder();
    let raw = "";

    for (const r of event.message.records) {
      raw += decoder.decode(r.data);
    }

    raw = String(raw || "").trim();
    console.log("RAW:", raw);

    // 🧠 超耐性パース
    let id = raw
      .replace("wallet=", "")
      .replace("wallet:", "")
      .trim();

    let match = id.match(/\d+/);
    if (match) id = match[0];

    if (!id || !db[id]) {
      speak("無効なカードです");
      log("❌ NFC失敗: " + raw);
      return;
    }

    current = id;

    document.getElementById("user").innerText =
      db[id].name + "（ID:" + id + "）";

    update();

    speak("ログインしました");
    log("✅ ログイン: " + id);
  };
}

/* 📊 更新 */
function update() {
  if (!current) return;
  db[current].balance = num(db[current].balance);

  document.getElementById("balance").innerText =
    db[current].balance;
}

/* 🏪 購入 */
function buy(price, item) {
  if (!current) {
    speak("NFCを読み取ってください");
    return;
  }

  price = num(price);

  if (price <= 0) {
    speak("無効な金額です");
    return;
  }

  if (db[current].balance < price) {
    speak("残高不足です");
    log("残高不足");
    return;
  }

  db[current].balance -= price;

  log(current + " - " + price + " " + item);

  beep();
  speak("支払い完了");
  update();
}

/* 🎁 お手伝い */
function charge() {
  if (!current) {
    speak("NFCを読み取ってください");
    return;
  }

  let v = num(document.getElementById("reward").value);

  if (v <= 0) {
    speak("無効な値です");
    return;
  }

  db[current].balance += v;

  log(current + " + " + v + " お手伝い");

  beep();
  speak("ポイント付与");
  update();
}

/* 🔊 音 */
function beep() {
  const ctx = new AudioContext();
  const o = ctx.createOscillator();
  o.frequency.value = 700;
  o.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.1);
}

/* 🔴 音声 */
function speak(text) {
  if (!text) return;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 1;
  u.pitch = 1;
  speechSynthesis.speak(u);
}

/* 📜 ログ */
function log(t) {
  document.getElementById("log").innerText += "\n" + t;
}

</script>

</body>
</html>
